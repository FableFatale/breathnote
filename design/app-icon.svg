<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F5FF"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#376CFF"/>
      <stop offset="100%" stop-color="#2554D9"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D172"/>
      <stop offset="100%" stop-color="#15B462"/>
    </linearGradient>
  </defs>

  <!-- Palermo Pure Surface Background -->
  <rect width="108" height="108" rx="24" fill="url(#bgGrad)"/>

  <!-- Upper Cover Plate (Symmetrical Capsule, No Horns/Folder Tab) -->
  <rect x="20" y="34" width="68" height="10" rx="5" fill="url(#plateGrad)"/>

  <!-- Lower Cover Plate (Symmetrical Capsule) -->
  <rect x="20" y="64" width="68" height="10" rx="5" fill="url(#plateGrad)"/>

  <!-- Central Comb Body -->
  <rect x="17" y="42" width="74" height="24" rx="6" fill="#FFFFFF" stroke="#376CFF" stroke-width="3.2"/>

  <!-- Left & Right Mounting Studs -->
  <circle cx="22.5" cy="54" r="1.8" fill="#9BB5FF"/>
  <circle cx="85.5" cy="54" r="1.8" fill="#9BB5FF"/>

  <!-- 5 Symmetrical Reed Slots (4th slot is Emerald First-Breath Highlight) -->
  <rect x="29" y="46.5" width="6.2" height="15" rx="2.4" fill="#376CFF"/>
  <rect x="39.5" y="46.5" width="6.2" height="15" rx="2.4" fill="#376CFF"/>
  <rect x="50" y="46.5" width="6.2" height="15" rx="2.4" fill="#376CFF"/>
  <rect x="60.5" y="45.5" width="6.6" height="17" rx="2.6" fill="url(#emeraldGrad)"/>
  <rect x="71.5" y="46.5" width="6.2" height="15" rx="2.4" fill="#376CFF"/>
</svg>
