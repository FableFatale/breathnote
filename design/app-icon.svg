<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4778FF"/>
      <stop offset="100%" stop-color="#2554D9"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34E886"/>
      <stop offset="100%" stop-color="#15B462"/>
    </linearGradient>
  </defs>

  <!-- Palermo Brand Blue Squircle Background -->
  <rect width="108" height="108" rx="24" fill="url(#bgGrad)"/>

  <!-- Symmetrical Upper & Lower Cover Plates -->
  <path d="M30 36 H78 A4 4 0 0 1 82 40 V42 H26 V40 A4 4 0 0 1 30 36 Z" fill="#FFFFFF" opacity="0.92"/>
  <path d="M26 66 H82 V68 A4 4 0 0 1 78 72 H30 A4 4 0 0 1 26 68 V66 Z" fill="#FFFFFF" opacity="0.92"/>

  <!-- Central Comb Body (Pure White) -->
  <rect x="22" y="43" width="64" height="22" rx="5" fill="#FFFFFF"/>

  <!-- 5 Symmetrical Reed Slots (4th slot is Palermo Emerald Highlight) -->
  <rect x="29.5" y="47.5" width="7" height="13" rx="2.2" fill="#1E4FD9"/>
  <rect x="40.0" y="47.5" width="7" height="13" rx="2.2" fill="#1E4FD9"/>
  <rect x="50.5" y="47.5" width="7" height="13" rx="2.2" fill="#1E4FD9"/>
  <rect x="60.6" y="46.5" width="7.8" height="15" rx="2.5" fill="url(#emeraldGrad)"/>
  <rect x="71.5" y="47.5" width="7" height="13" rx="2.2" fill="#1E4FD9"/>
</svg>
