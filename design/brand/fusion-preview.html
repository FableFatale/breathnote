<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <style>
      body { margin: 0; background: #F3EDE2; font-family: system-ui, sans-serif; color: #2A2620; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 40px; }
      figure { margin: 0; }
      img { width: 320px; height: 320px; display: block; }
      figcaption { margin-top: 12px; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <img src="mingjie-fusion.svg" alt="A1 与 A2 融合无手版">
        <figcaption>无手版</figcaption>
      </figure>
      <figure>
        <img src="mingjie-fusion-hand.svg" alt="A1 与 A2 融合托举形版">
        <figcaption>托举形版</figcaption>
      </figure>
    </main>
  </body>
</html>
