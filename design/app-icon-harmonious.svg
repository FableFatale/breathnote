<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 1. Serene Acoustic Navy Gradient (深邃温润的声学夜海蓝，消除刺眼电光蓝) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2B4D"/>
      <stop offset="50%" stop-color="#17223D"/>
      <stop offset="100%" stop-color="#10182E"/>
    </linearGradient>

    <!-- 2. Soft Center Acoustic Ambient Aura (柔和中心微光) -->
    <radialGradient id="ambientGlow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#2D4373" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#17223D" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#10182E" stop-opacity="0"/>
    </radialGradient>

    <!-- 3. Harmonious Sage Jade / Mint Emerald for 4th Hole (温润薄荷翡翠，不刺眼) -->
    <linearGradient id="jadeAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- 4. Subtle Jade Aura (温和声光晕) -->
    <radialGradient id="jadeAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <!-- 5. Acoustic Chamber Depth for regular slots (声学腔体自然暗色) -->
    <linearGradient id="chamberDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#15213B"/>
    </linearGradient>

    <!-- 6. Matte Porcelain White Body Gradient (温润哑光白瓷质感，非刺眼纯白) -->
    <linearGradient id="porcelainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F9"/>
    </linearGradient>

    <!-- 7. Aerodynamic Plate Bevel Tones (极简微结构折面) -->
    <linearGradient id="plateTopTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="plateBottomTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- 8. Soft Tactile Elevation Shadow (克制环境软阴影) -->
    <filter id="softElevation" x="-12%" y="-15%" width="124%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#050914" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#050914" flood-opacity="0.25"/>
    </filter>

    <clipPath id="squircleClip">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
  </defs>

  <!-- Background Base Canvas (iOS Squircle) -->
  <rect width="1024" height="1024" rx="228" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#ambientGlow)"/>

  <!-- Harmonious Ambient Acoustic Waves (与底色自然相融的同心声波，极度静谧) -->
  <g clip-path="url(#squircleClip)">
    <ellipse cx="512" cy="516" rx="430" ry="250" fill="none" stroke="#64748B" stroke-width="1.8" opacity="0.16"/>
    <ellipse cx="512" cy="516" rx="350" ry="200" fill="none" stroke="#94A3B8" stroke-width="2.0" opacity="0.22"/>
    <ellipse cx="512" cy="516" rx="270" ry="155" fill="none" stroke="#CBD5E1" stroke-width="2.2" opacity="0.28"/>
    <ellipse cx="512" cy="516" rx="190" ry="110" fill="none" stroke="#34D399" stroke-width="2.5" opacity="0.32"/>
    
    <!-- Gentle Harmonic Wave Arc (极简声学流线，克制轻盈) -->
    <path d="M 140 440 C 280 370, 370 470, 512 430 C 654 390, 744 480, 884 430" 
          fill="none" stroke="#E2E8F0" stroke-width="2.5" opacity="0.20"/>
  </g>

  <!-- Harmonious Jade Halo behind 4th hole (温和薄荷玉绿环境光环) -->
  <circle cx="512" cy="512" r="140" fill="url(#jadeAura)"/>

  <!-- Modern Graphic Harmonica Silhouette (去除过拟合逼真质感，回归现代平面图标精工雕塑) -->
  <g filter="url(#softElevation)">

    <!-- Top Air-guide Cover Plate (极简上护板弧面) -->
    <path d="M 232 352 
             L 792 352 
             A 36 36 0 0 1 828 388 
             L 828 416 
             L 196 416 
             L 196 388 
             A 36 36 0 0 1 232 352 Z" 
          fill="url(#plateTopTone)"/>

    <!-- Bottom Cover Plate (极简下护板弧面) -->
    <path d="M 196 608 
             L 828 608 
             L 828 636 
             A 36 36 0 0 1 792 672 
             L 232 672 
             A 36 36 0 0 1 196 636 Z" 
          fill="url(#plateBottomTone)"/>

    <!-- Central Acoustic Comb Body (白瓷雅白琴格主体) -->
    <rect x="180" y="416" width="664" height="192" rx="32" fill="url(#porcelainGrad)"/>
    
    <!-- Minimalist Edge Chamfer (极其精致的 1px 细微倒角光影，替代粗暴厚度) -->
    <rect x="181" y="417" width="662" height="190" rx="31" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.85"/>
    <line x1="200" y1="416" x2="824" y2="416" stroke="#CBD5E1" stroke-width="1.2" opacity="0.7"/>
    <line x1="200" y1="608" x2="824" y2="608" stroke="#CBD5E1" stroke-width="1.2" opacity="0.7"/>

    <!-- Clean Acoustic Dot Accents (极简声学定位点，替代拟物螺钉) -->
    <circle cx="218" cy="402" r="4.5" fill="#94A3B8" opacity="0.8"/>
    <circle cx="806" cy="402" r="4.5" fill="#94A3B8" opacity="0.8"/>

    <!-- 7 Balanced Golden Proportion Acoustic Reed Apertures (和谐声学孔阵) -->
    
    <!-- Hole 1 -->
    <rect x="248" y="456" width="56" height="112" rx="16" fill="url(#chamberDepth)"/>

    <!-- Hole 2 -->
    <rect x="328" y="456" width="56" height="112" rx="16" fill="url(#chamberDepth)"/>

    <!-- Hole 3 -->
    <rect x="408" y="456" width="56" height="112" rx="16" fill="url(#chamberDepth)"/>

    <!-- Hole 4: The Hero "初鸣 / First Clear Note" (温润薄荷翡翠，与深蓝雅白天然和谐) -->
    <!-- Aperture Frame -->
    <rect x="488" y="448" width="64" height="128" rx="18" fill="url(#jadeAccent)"/>
    <!-- Subtle Inner Reflection (内敛高光) -->
    <ellipse cx="520" cy="478" rx="14" ry="18" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="520" cy="512" r="5" fill="#FFFFFF" opacity="0.75"/>

    <!-- Hole 5 -->
    <rect x="572" y="456" width="56" height="112" rx="16" fill="url(#chamberDepth)"/>

    <!-- Hole 6 -->
    <rect x="652" y="456" width="56" height="112" rx="16" fill="url(#chamberDepth)"/>

    <!-- Hole 7 -->
    <rect x="732" y="456" width="56" height="112" rx="16" fill="url(#chamberDepth)"/>

  </g>
</svg>