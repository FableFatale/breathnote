<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background Deep Navy -->
    <linearGradient id="stepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A243F"/>
      <stop offset="60%" stop-color="#121A30"/>
      <stop offset="100%" stop-color="#0A1020"/>
    </linearGradient>

    <!-- Stepped Body Pure Ceramic Ivory -->
    <linearGradient id="ivoryBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#F5F7FC"/>
      <stop offset="100%" stop-color="#E2E8F4"/>
    </linearGradient>

    <!-- Bold Intaglio Recess -->
    <linearGradient id="stepSlot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090E1C"/>
      <stop offset="100%" stop-color="#141E38"/>
    </linearGradient>

    <!-- Hero Jade Emerald -->
    <linearGradient id="heroJadeStep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="stepShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#040712" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#040712" flood-opacity="0.25"/>
    </filter>

    <clipPath id="squircleStep">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#stepBg)"/>

  <!-- Subtle Ascending Soundwave Rings in Background -->
  <g clip-path="url(#squircleStep)" opacity="0.25">
    <ellipse cx="512" cy="520" rx="420" ry="240" fill="none" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="512" cy="520" rx="320" ry="180" fill="none" stroke="#94A3B8" stroke-width="2.2"/>
    <ellipse cx="512" cy="520" rx="220" ry="120" fill="none" stroke="#34D399" stroke-width="2.5" opacity="0.4"/>
  </g>

  <!-- Iconic Ascending Step Harmonica Symbol (鸣阶图腾) -->
  <g filter="url(#stepShadow)">
    
    <!-- 整体上升阶梯外轮廓 (从左向右阶梯步步高升，体现“阶”) -->
    <path d="M 190 620 
             L 190 480 
             A 28 28 0 0 1 218 452 
             L 320 452 
             L 320 412 
             A 28 28 0 0 1 348 384 
             L 450 384 
             L 450 344 
             A 28 28 0 0 1 478 316 
             L 806 316 
             A 28 28 0 0 1 834 344 
             L 834 620 
             A 28 28 0 0 1 806 648 
             L 218 648 
             A 28 28 0 0 1 190 620 Z" 
          fill="url(#ivoryBody)"/>
    
    <!-- 微倒角高光边 -->
    <path d="M 191 619 L 191 480 A 27 27 0 0 1 218 453 L 320 453 L 320 413 A 27 27 0 0 1 347 385 L 450 385 L 450 345 A 27 27 0 0 1 477 317 L 806 317 A 27 27 0 0 1 833 345 L 833 619" 
          fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

    <!-- ============================================== -->
    <!-- 粗壮饱满的阴刻孔位 (Bold Intaglio Apertures) -->
    <!-- ============================================== -->

    <!-- Slot 1 (低音区) -->
    <rect x="230" y="474" width="76" height="136" rx="20" fill="url(#stepSlot)"/>
    <path d="M 236 608 Q 268 611 300 608" stroke="#FFFFFF" stroke-width="1.8" opacity="0.3" fill="none"/>

    <!-- Slot 2 -->
    <rect x="346" y="474" width="76" height="136" rx="20" fill="url(#stepSlot)"/>
    <path d="M 352 608 Q 384 611 416 608" stroke="#FFFFFF" stroke-width="1.8" opacity="0.3" fill="none"/>

    <!-- Slot 3 -->
    <rect x="462" y="474" width="76" height="136" rx="20" fill="url(#stepSlot)"/>
    <path d="M 468 608 Q 500 611 532 608" stroke="#FFFFFF" stroke-width="1.8" opacity="0.3" fill="none"/>

    <!-- Slot 4: 初鸣翡翠高亮孔 (加粗焦点，步步高升) -->
    <rect x="578" y="458" width="86" height="152" rx="22" fill="#10B981" opacity="0.25"/>
    <rect x="581" y="461" width="80" height="146" rx="20" fill="url(#heroJadeStep)"/>
    <ellipse cx="621" cy="495" rx="16" ry="20" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="621" cy="530" r="5" fill="#FFFFFF" opacity="0.8"/>
    <path d="M 589 605 Q 621 608 653 605" stroke="#A7F3D0" stroke-width="2" opacity="0.7" fill="none"/>

    <!-- Slot 5 (高音区) -->
    <rect x="702" y="474" width="76" height="136" rx="20" fill="url(#stepSlot)"/>
    <path d="M 708 608 Q 740 611 772 608" stroke="#FFFFFF" stroke-width="1.8" opacity="0.3" fill="none"/>

  </g>
</svg>