<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 1. Serene Acoustic Navy Gradient (深邃温润的声学夜海蓝) -->
    <linearGradient id="bgDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2644"/>
      <stop offset="50%" stop-color="#141D35"/>
      <stop offset="100%" stop-color="#0D1324"/>
    </linearGradient>

    <!-- 2. Ambient Acoustic Glow (中心柔和声学微光) -->
    <radialGradient id="centerAmbient" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#263963" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#141D35" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0D1324" stop-opacity="0"/>
    </radialGradient>

    <!-- 3. Matte Ceramic White Comb Body (温润白瓷琴体) -->
    <linearGradient id="ceramicBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFD"/>
      <stop offset="100%" stop-color="#E8EEF8"/>
    </linearGradient>

    <!-- 4. Aerodynamic Cover Plates (极简上下护板微折面) -->
    <linearGradient id="plateTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF3FA"/>
    </linearGradient>
    <linearGradient id="plateBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DEE6F2"/>
      <stop offset="100%" stop-color="#F8FAFD"/>
    </linearGradient>

    <!-- 5. Intaglio Chamber Shadow (加粗阴刻深邃声学腔体) -->
    <linearGradient id="intaglioDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1222"/>
      <stop offset="40%" stop-color="#111B33"/>
      <stop offset="100%" stop-color="#182544"/>
    </linearGradient>

    <!-- 6. Bold Emerald Hero Chamber (第 4 孔加粗初鸣翡翠，温和饱满) -->
    <linearGradient id="heroJade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- 7. Hero Jade Ambient Aura (第 4 孔翡翠呼吸声晕) -->
    <radialGradient id="jadeAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <!-- 8. Soft Tactile Elevation Shadow (琴体微浮雕投影) -->
    <filter id="bodyElevation" x="-12%" y="-15%" width="124%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="32" flood-color="#050814" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#050814" flood-opacity="0.25"/>
    </filter>

    <clipPath id="squircleMask">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1024" height="1024" rx="228" fill="url(#bgDeep)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#centerAmbient)"/>

  <!-- Serene Low-Contrast Acoustic Resonance Waves (低反差温润同心声浪) -->
  <g clip-path="url(#squircleMask)">
    <ellipse cx="512" cy="516" rx="430" ry="250" fill="none" stroke="#475569" stroke-width="2.0" opacity="0.18"/>
    <ellipse cx="512" cy="516" rx="350" ry="200" fill="none" stroke="#64748B" stroke-width="2.2" opacity="0.22"/>
    <ellipse cx="512" cy="516" rx="270" ry="155" fill="none" stroke="#94A3B8" stroke-width="2.5" opacity="0.26"/>
    <ellipse cx="512" cy="516" rx="190" ry="110" fill="none" stroke="#34D399" stroke-width="2.8" opacity="0.30"/>
    
    <!-- Gentle Harmonic Breath Ribbon (极其轻盈的气息流线) -->
    <path d="M 130 430 C 270 360, 370 470, 512 425 C 654 380, 754 480, 894 425" 
          fill="none" stroke="#CBD5E1" stroke-width="2.5" opacity="0.16"/>
  </g>

  <!-- Ambient Jade Aura for 4th Hole -->
  <circle cx="616" cy="512" r="160" fill="url(#jadeAura)"/>

  <!-- Harmonica Assembly -->
  <g filter="url(#bodyElevation)">

    <!-- Top Air-guide Cover Plate (上护板) -->
    <path d="M 216 348 
             L 808 348 
             A 36 36 0 0 1 844 384 
             L 844 414 
             L 180 414 
             L 180 384 
             A 36 36 0 0 1 216 348 Z" 
          fill="url(#plateTop)"/>

    <!-- Bottom Cover Plate (下护板) -->
    <path d="M 180 610 
             L 844 610 
             L 844 640 
             A 36 36 0 0 1 808 676 
             L 216 676 
             A 36 36 0 0 1 180 640 Z" 
          fill="url(#plateBottom)"/>

    <!-- Central Ceramic Comb Body (白瓷琴格主体) -->
    <rect x="164" y="414" width="696" height="196" rx="36" fill="url(#ceramicBody)"/>
    
    <!-- 1px Precision Bevel Highlight (微倒角边缘光) -->
    <rect x="165" y="415" width="694" height="194" rx="35" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    
    <!-- Top & Bottom Plate Seams (装配接缝微线) -->
    <line x1="184" y1="414" x2="840" y2="414" stroke="#CBD5E1" stroke-width="1.5" opacity="0.75"/>
    <line x1="184" y1="610" x2="840" y2="610" stroke="#CBD5E1" stroke-width="1.5" opacity="0.75"/>

    <!-- Left & Right Minimalist Acoustic Screws (极简声学微点) -->
    <circle cx="204" cy="398" r="5" fill="#94A3B8" opacity="0.85"/>
    <circle cx="820" cy="398" r="5" fill="#94A3B8" opacity="0.85"/>

    <!-- ======================================================== -->
    <!-- 重点加粗加宽的 5 组主音孔【阴刻区域】(Bold Intaglio Chambers) -->
    <!-- 消除细长槽条感，孔宽增大至 82px，比例饱满，在小尺寸下极其坚挺 -->
    <!-- ======================================================== -->

    <!-- Chamber 1 (阴刻孔 1) -->
    <g>
      <!-- Top Inner Shadow Bevel (阴刻顶部阴影折面，强化下陷感) -->
      <rect x="220" y="450" width="82" height="124" rx="22" fill="#060A14"/>
      <!-- Chamber Core Fill -->
      <rect x="220" y="452" width="82" height="122" rx="22" fill="url(#intaglioDark)"/>
      <!-- Bottom Lip Specular (阴刻下边缘反光) -->
      <path d="M 226 572 Q 261 575 296 572" stroke="#FFFFFF" stroke-width="1.8" opacity="0.4" fill="none"/>
    </g>

    <!-- Chamber 2 (阴刻孔 2) -->
    <g>
      <rect x="338" y="450" width="82" height="124" rx="22" fill="#060A14"/>
      <rect x="338" y="452" width="82" height="122" rx="22" fill="url(#intaglioDark)"/>
      <path d="M 344 572 Q 379 575 414 572" stroke="#FFFFFF" stroke-width="1.8" opacity="0.4" fill="none"/>
    </g>

    <!-- Chamber 3 (阴刻孔 3) -->
    <g>
      <rect x="456" y="450" width="82" height="124" rx="22" fill="#060A14"/>
      <rect x="456" y="452" width="82" height="122" rx="22" fill="url(#intaglioDark)"/>
      <path d="M 462 572 Q 497 575 532 572" stroke="#FFFFFF" stroke-width="1.8" opacity="0.4" fill="none"/>
    </g>

    <!-- Chamber 4: HERO "初鸣" 翡翠主孔 (重点加粗、饱满温润) -->
    <g>
      <!-- Outer Jade Soft Edge -->
      <rect x="568" y="440" width="96" height="144" rx="26" fill="#10B981" opacity="0.25"/>
      <!-- Deep Recessed Base -->
      <rect x="572" y="442" width="88" height="140" rx="24" fill="#04321A"/>
      <!-- Vibrant Jade Master Core -->
      <rect x="572" y="444" width="88" height="138" rx="24" fill="url(#heroJade)"/>
      
      <!-- Inner Acoustic Depth & Specular (柔和内壁反光) -->
      <ellipse cx="616" cy="478" rx="20" ry="24" fill="#FFFFFF" opacity="0.4"/>
      <circle cx="616" cy="516" r="6" fill="#FFFFFF" opacity="0.8"/>
      
      <!-- Bottom Inner Rim Light -->
      <path d="M 580 580 Q 616 584 652 580" stroke="#A7F3D0" stroke-width="2.2" opacity="0.75" fill="none"/>
    </g>

    <!-- Chamber 5 (阴刻孔 5) -->
    <g>
      <rect x="702" y="450" width="82" height="124" rx="22" fill="#060A14"/>
      <rect x="702" y="452" width="82" height="122" rx="22" fill="url(#intaglioDark)"/>
      <path d="M 708 572 Q 743 575 778 572" stroke="#FFFFFF" stroke-width="1.8" opacity="0.4" fill="none"/>
    </g>

  </g>
</svg>