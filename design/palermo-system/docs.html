<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palermo × 初鸣 (Breathnote) — Design System</title>
  <style>
    :root, [data-theme="light"] {
      --bg-outer: #F6F6F5;
      --bg-panel: #FFFFFF;
      --bg-subtle: #FAFAFA;
      --bg-muted: #F2F2F0;
      --bg-hover: #EFEFED;
      --bg-active: #E8E8E6;
      --border-main: #E6E6E4;
      --border-subtle: #ECECEB;
      --border-strong: #D4D4D0;
      --cad-node-bg: #FFFFFF;
      --cad-node-border: #CCCCCC;

      --text-primary: #141413;
      --text-secondary: #6E6D6A;
      --text-muted: #9B9A97;
      --text-code: #1F1F1D;

      --blue-base: #376CFF;
      --blue-muted: #EBF1FF;
      --blue-border: #ADC4FF;
      --blue-emphasis: #1E4FD9;

      --green-base: #15B462;
      --green-muted: #E8F8F0;
      --green-border: #9EE4BF;
      --green-emphasis: #0E8A4A;

      --orange-base: #FE6E00;
      --orange-muted: #FFF1E6;
      --orange-border: #FFC299;
      --orange-emphasis: #CC5800;

      --red-base: #FF5F57;
      --red-muted: #FFEFEE;
      --red-border: #FFB8B4;
      --red-emphasis: #D93830;

      --purple-base: #8B5CF6;
      --purple-muted: #F3E8FF;
      --purple-border: #DDD6FE;
    }

    [data-theme="dark"] {
      --bg-outer: #0E0D0C;
      --bg-panel: #151413;
      --bg-subtle: #1A1918;
      --bg-muted: #222120;
      --bg-hover: #252423;
      --bg-active: #2E2D2B;
      --border-main: #262524;
      --border-subtle: #1F1E1D;
      --border-strong: #383634;
      --cad-node-bg: #151413;
      --cad-node-border: #454340;

      --text-primary: #F5F5F3;
      --text-secondary: #9A9893;
      --text-muted: #666460;
      --text-code: #E6E4DF;

      --blue-base: #5E9BFF;
      --blue-muted: #162238;
      --blue-border: #28467A;
      --blue-emphasis: #99C2FF;

      --green-base: #36D97E;
      --green-muted: #11291B;
      --green-border: #1E5432;
      --green-emphasis: #8DF5B8;

      --orange-base: #FF8B1A;
      --orange-muted: #2C190A;
      --orange-border: #613615;
      --orange-emphasis: #FFB770;

      --red-base: #FF6369;
      --red-muted: #2E1315;
      --red-border: #632427;
      --red-emphasis: #FFA1A4;

      --purple-base: #A78BFA;
      --purple-muted: #211838;
      --purple-border: #433270;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-outer);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.6;
      letter-spacing: -0.011em;
      -webkit-font-smoothing: antialiased;
    }

    code, pre, .mono {
      font-family: "JetBrains Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
    }

    /* App Layout: Sidebar + Floating Inset Panel (Exact Palermo Structure) */
    .app-shell {
      display: flex;
      height: 100vh;
      width: 100vw;
      padding: 8px 8px 8px 0;
    }

    /* Left Sidebar */
    .sidebar {
      width: 236px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 12px 12px 8px 16px;
      user-select: none;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 6px 14px;
      cursor: pointer;
    }

    .sidebar-brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .sidebar-brand-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 99px;
      background: var(--bg-muted);
      color: var(--text-secondary);
      border: 1px solid var(--border-main);
    }

    /* Search Bar */
    .search-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 34px;
      padding: 0 10px;
      border-radius: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border-main);
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 16px;
      transition: border-color 0.15s ease;
    }

    .search-trigger:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .kbd {
      font-size: 11px;
      font-family: inherit;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--bg-muted);
      border: 1px solid var(--border-main);
      color: var(--text-secondary);
    }

    /* Sidebar Scrollable Nav */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .sidebar-nav::-webkit-scrollbar {
      width: 4px;
    }
    .sidebar-nav::-webkit-scrollbar-thumb {
      background: var(--border-main);
      border-radius: 4px;
    }

    .nav-section-title {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 8px 10px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 6px 10px;
      border-radius: 7px;
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 450;
      text-decoration: none;
      cursor: pointer;
      border: none;
      background: transparent;
      text-align: left;
      transition: background 0.12s ease, color 0.12s ease;
      margin-bottom: 1px;
    }

    .nav-item:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--bg-active);
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Sidebar Footer (Sun / Moon / System + Website link) */
    .sidebar-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 4px 4px;
      margin-top: 6px;
    }

    .theme-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px;
      border-radius: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border-main);
      gap: 2px;
    }

    .theme-btn {
      width: 26px;
      height: 24px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
    }

    .theme-btn.active {
      background: var(--bg-active);
      color: var(--text-primary);
    }

    .footer-link {
      font-size: 12.5px;
      color: var(--text-secondary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border-radius: 6px;
    }
    .footer-link:hover {
      color: var(--text-primary);
    }

    /* Main Floating Inset Panel */
    .main-panel {
      flex: 1;
      height: 100%;
      background: var(--bg-panel);
      border: 1px solid var(--border-main);
      border-radius: 14px;
      overflow-y: auto;
      position: relative;
    }

    .doc-container {
      max-width: 780px;
      margin: 0 auto;
      padding: 64px 40px 96px;
    }

    .doc-title {
      font-size: 28px;
      font-weight: 650;
      letter-spacing: -0.025em;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .doc-lead {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.65;
      margin-bottom: 44px;
    }

    .doc-section {
      margin-bottom: 48px;
    }

    .doc-h2 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.018em;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .doc-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      line-height: 1.65;
    }

    .inline-code {
      font-family: "JetBrains Mono", monospace;
      font-size: 12.5px;
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--bg-muted);
      color: var(--text-code);
    }

    /* Signature Palermo CAD Corner-Node Box */
    .cad-box {
      position: relative;
      border: 1px solid var(--border-main);
      background: var(--bg-panel);
      margin-top: 8px;
    }

    .cad-node {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--cad-node-bg);
      border: 1px solid var(--cad-node-border);
      z-index: 3;
      pointer-events: none;
    }
    .cad-node.tl { top: -3.5px; left: -3.5px; }
    .cad-node.tr { top: -3.5px; right: -3.5px; }
    .cad-node.bl { bottom: -3.5px; left: -3.5px; }
    .cad-node.br { bottom: -3.5px; right: -3.5px; }
    .cad-node.tc { top: -3.5px; left: calc(50% - 3px); }
    .cad-node.bc { bottom: -3.5px; left: calc(50% - 3px); }
    .cad-node.ml { top: calc(50% - 3px); left: -3.5px; }
    .cad-node.mr { top: calc(50% - 3px); right: -3.5px; }
    .cad-node.mc { top: calc(50% - 3px); left: calc(50% - 3px); }

    /* Preview / Code Tabs (Exact Palermo Underline Tab Bar) */
    .preview-tabs {
      display: flex;
      gap: 18px;
      margin-bottom: 6px;
    }

    .preview-tab {
      background: transparent;
      border: none;
      padding: 6px 2px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .preview-tab:hover {
      color: var(--text-primary);
    }

    .preview-tab.active {
      color: var(--text-primary);
      border-bottom-color: var(--text-primary);
    }

    .preview-stage {
      min-height: 220px;
      padding: 40px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .code-stage {
      display: none;
      padding: 20px 24px;
      background: var(--bg-subtle);
      overflow-x: auto;
      position: relative;
    }

    .code-stage pre {
      font-size: 12.5px;
      line-height: 1.65;
      color: var(--text-code);
    }

    .copy-code-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-main);
      background: var(--bg-panel);
      color: var(--text-secondary);
      cursor: pointer;
    }
    .copy-code-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    /* Get Started 2x2 CAD Grid */
    .gs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .gs-cell {
      padding: 28px;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.15s ease;
      text-decoration: none;
      color: inherit;
    }
    .gs-cell:hover {
      background: var(--bg-subtle);
    }
    .gs-cell:nth-child(1) { border-right: 1px solid var(--border-main); border-bottom: 1px solid var(--border-main); }
    .gs-cell:nth-child(2) { border-bottom: 1px solid var(--border-main); }
    .gs-cell:nth-child(3) { border-right: 1px solid var(--border-main); }

    .gs-art {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 0;
    }

    /* Colors Token List (Exact Palermo Side-by-Side LIGHT / DARK Swatches) */
    .token-stack {
      border: 1px solid var(--border-main);
    }

    .token-row {
      padding: 22px 24px;
      border-bottom: 1px solid var(--border-main);
    }
    .token-row:last-child {
      border-bottom: none;
    }

    .token-name-bar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 14px;
      cursor: pointer;
    }
    .token-name-bar:hover {
      color: var(--text-primary);
    }

    .token-dual-swatches {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      max-width: 560px;
    }

    .swatch-pair {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .swatch-tile {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      flex-shrink: 0;
    }

    .swatch-mode {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }

    .swatch-val {
      font-size: 12.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Typography Rows (Exact Palermo Specimen Stack) */
    .type-row {
      padding: 26px 28px;
      border-bottom: 1px solid var(--border-main);
    }
    .type-row:last-child {
      border-bottom: none;
    }
    .type-sample {
      margin: 10px 0 12px;
      color: var(--text-primary);
    }
    .type-meta {
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    /* Properties Table (Exact Palermo Component API Table) */
    .props-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--border-main);
      font-size: 13px;
      margin-top: 12px;
    }
    .props-table th {
      text-align: left;
      padding: 10px 16px;
      background: var(--bg-subtle);
      color: var(--text-secondary);
      font-weight: 600;
      border-bottom: 1px solid var(--border-main);
    }
    .props-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-main);
      vertical-align: top;
    }
    .props-table tr:last-child td {
      border-bottom: none;
    }

    /* Palermo UI Primitives for Previews */
    .p-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-main);
      background: var(--bg-subtle);
      color: var(--text-primary);
      transition: all 0.14s ease;
    }
    .p-btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
    .p-btn-micro { height: 24px; padding: 0 8px; font-size: 11.5px; border-radius: 6px; }
    .p-btn-small { height: 30px; padding: 0 11px; font-size: 12.5px; border-radius: 7px; }
    .p-btn-regular { height: 36px; padding: 0 14px; font-size: 13.5px; border-radius: 8px; }
    .p-btn-large { height: 42px; padding: 0 18px; font-size: 14.5px; border-radius: 10px; }

    .p-btn-primary {
      background: var(--blue-base);
      border-color: var(--blue-base);
      color: #FFFFFF;
    }
    .p-btn-primary:hover { opacity: 0.92; background: var(--blue-base); }

    .p-btn-success {
      background: var(--green-base);
      border-color: var(--green-base);
      color: #FFFFFF;
    }

    .p-btn-destructive {
      background: var(--red-muted);
      border-color: var(--red-border);
      color: var(--red-emphasis);
    }

    .p-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 650;
      border: 1px solid transparent;
    }
    .p-pill-blue { background: var(--blue-muted); border-color: var(--blue-border); color: var(--blue-emphasis); }
    .p-pill-green { background: var(--green-muted); border-color: var(--green-border); color: var(--green-emphasis); }
    .p-pill-orange { background: var(--orange-muted); border-color: var(--orange-border); color: var(--orange-emphasis); }
    .p-pill-red { background: var(--red-muted); border-color: var(--red-border); color: var(--red-emphasis); }

    /* Bottom Prev/Next Page Footer */
    .doc-pager {
      display: flex;
      justify-content: space-between;
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--border-main);
    }

    .pager-btn {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-main);
      background: var(--bg-subtle);
      color: var(--text-primary);
      cursor: pointer;
      min-width: 150px;
    }
    .pager-btn:hover {
      border-color: var(--border-strong);
      background: var(--bg-hover);
    }
    .pager-label { font-size: 11px; color: var(--text-muted); }
    .pager-title { font-size: 13.5px; font-weight: 600; }

    /* Search Command Modal (⌘K) */
    .cmd-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 12vh;
      z-index: 50;
    }
    .cmd-backdrop.open { display: flex; }
    .cmd-modal {
      width: 520px;
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }
    .cmd-input {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-bottom: 1px solid var(--border-main);
      background: transparent;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }
    .cmd-list {
      max-height: 320px;
      overflow-y: auto;
      padding: 8px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 8px 14px;
      border-radius: 8px;
      background: var(--text-primary);
      color: var(--bg-panel);
      font-size: 12.5px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
      z-index: 90;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Left Sidebar (Exact Palermo Navigation) -->
    <aside class="sidebar">
      <div class="sidebar-brand" onclick="navigate('get-started')">
        <svg width="22" height="22" viewBox="0 0 108 108">
          <rect width="108" height="108" rx="24" fill="#376CFF"/>
          <rect x="24" y="36" width="60" height="7" rx="3.5" fill="#FFFFFF" opacity="0.92"/>
          <rect x="24" y="65" width="60" height="7" rx="3.5" fill="#FFFFFF" opacity="0.92"/>
          <rect x="21" y="43" width="66" height="22" rx="5" fill="#FFFFFF"/>
          <rect x="28" y="47" width="6" height="14" rx="2" fill="#1E4FD9"/>
          <rect x="39" y="47" width="6" height="14" rx="2" fill="#1E4FD9"/>
          <rect x="50" y="47" width="6" height="14" rx="2" fill="#1E4FD9"/>
          <rect x="61" y="46" width="6.5" height="16" rx="2.2" fill="#15B462"/>
          <rect x="72" y="47" width="6" height="14" rx="2" fill="#1E4FD9"/>
        </svg>
        <span class="sidebar-brand-title">初鸣 Palermo</span>
        <span class="sidebar-brand-badge mono">v1.2</span>
      </div>

      <button class="search-trigger" onclick="openSearch()">
        <span>🔍 Search</span>
        <span class="kbd">⌘ K</span>
      </button>

      <nav class="sidebar-nav" id="sidebarNav"></nav>

      <div class="sidebar-footer">
        <div class="theme-pill">
          <button class="theme-btn active" id="btnLight" title="Light theme" onclick="setTheme('light')">☀</button>
          <button class="theme-btn" id="btnDark" title="Dark theme" onclick="setTheme('dark')">☾</button>
          <button class="theme-btn" id="btnSys" title="System theme" onclick="setTheme('system')">🖥</button>
        </div>
        <a class="footer-link" href="#/docs/get-started" onclick="copyText('/Users/smartisan/qinyin/artifacts/breathnote-current-debug.apk')">APK ↗</a>
      </div>
    </aside>

    <!-- Right Floating Inset Panel -->
    <main class="main-panel" id="mainPanel">
      <div class="doc-container" id="docContent"></div>
    </main>
  </div>

  <!-- ⌘K Search Modal -->
  <div class="cmd-backdrop" id="cmdBackdrop" onclick="if(event.target===this)closeSearch()">
    <div class="cmd-modal">
      <input class="cmd-input" id="cmdInput" placeholder="搜索 Foundation 或 Component（如 Button, Harmonica, Colors, Splash...）" oninput="renderSearchList(this.value)" />
      <div class="cmd-list" id="cmdList"></div>
    </div>
  </div>

  <div class="toast" id="toast">已复制</div>

  <script>
    // Navigation Catalog (Foundation + Alphabetical Components matching Palermo structure)
    const PAGES = [
      // Foundation
      { id: 'get-started', group: 'Foundation', title: 'Get Started' },
      { id: 'brand', group: 'Foundation', title: 'Brand & Mascot' },
      { id: 'colors', group: 'Foundation', title: 'Colors' },
      { id: 'typography', group: 'Foundation', title: 'Typography' },
      { id: 'localization', group: 'Foundation', title: 'Localization & Copy' },
      { id: 'layout-padding', group: 'Foundation', title: 'Layout & Padding' },

    function copyText(txt) {

      document.getElementById('btnLight').classList.toggle('active', mode === 'light');
      document.getElementById('btnDark').classList.toggle('active', mode === 'dark');
      document.getElementById('btnSys').classList.toggle('active', mode === 'system');

      document.getElementById('cmdList').innerHTML = matches.map(p => `

          <span style="font-size:11px;color:var(--text-muted)">${p.group}</span>
        </button>
      `).join('');

                <div style="flex:1;padding:14px;border-radius:16px;border:1.5px solid var(--blue-base);background:var(--bg-panel);">
                  <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
                    <span class="p-pill p-pill-blue" style="font-size:10.5px;padding:2px 8px;">当前进行中</span>
                    <span class="mono" style="font-size:11px;color:var(--text-secondary);">约 6 分钟</span>
                  </div>
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                    <div>
                      <div style="font-weight:700;font-size:15.5px;">吹响第一个音</div>
                      <div style="font-size:12px;color:var(--text-secondary);">4 孔吹气，清晰起音</div>
                    </div>
                    <button class="p-btn p-btn-small p-btn-primary">▶</button>
                  </div>
                  <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    <span class="p-pill p-pill-blue" style="font-size:11px;">1. 听 4↑ 示范</span>
                    <span class="p-pill" style="font-size:11px;background:var(--bg-muted);color:var(--text-secondary);">2. 对准第 4 孔</span>
                    <span class="p-pill" style="font-size:11px;background:var(--bg-muted);color:var(--text-secondary);">3. 吹响 Do</span>
                  </div>
                </div>
              </div>
              <!-- Progressive Upcoming Locked Stage -->
              <div style="display:flex;align-items:flex-start;gap:12px;">
                <div style="width:34px;height:34px;border-radius:99px;background:var(--bg-subtle);border:1px solid var(--border-strong);color:var(--orange-base);display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:4px;">⏳</div>
                <div style="flex:1;padding:10px 14px;border-radius:12px;border:1px solid var(--border-main);background:var(--bg-subtle);opacity:0.88;">
                  <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div>
                      <span class="p-pill p-pill-orange" style="font-size:10px;padding:1px 7px;margin-bottom:4px;">下一阶段解锁 · 第 03 课</span>
                      <div style="font-weight:600;font-size:14px;color:var(--text-secondary);">清晰的单音</div>
                    </div>
                    <button class="p-btn p-btn-micro" onclick="const el=document.getElementById('lpPreview3');el.style.display=el.style.display==='none'?'block':'none'">预览脉络 ▾</button>
                  </div>
                  <div id="lpPreview3" style="display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-main);font-size:12px;color:var(--text-secondary);">
                    5 孔吹气，嘴型与气息 · [1. 缩小嘴型] → [2. 锁定第 5 孔] → [3. 稳定单音]
                  </div>
                </div>
              </div>
            </div>
          `,
          code: `_TimelineLesson(
  lesson: lesson,
  lessonIndex: index,
  nextLessonIndex: nextIndex,
  complete: controller.completedLessons.contains(lesson.id),
  active: lesson.id == nextLesson.id,
  first: index == 0,
  last: index == lessons.length - 1,
  onTap: () => _openLesson(context, lesson),
)`,
          props: [
            ['complete', 'bool', 'Renders compact green check review card.'],
            ['active', 'bool', 'Renders expanded Current Stage card with 3 progressive micro-step pills.'],
            ['isImmediateNext', 'bool', 'Highlights the next unlockable stage while keeping later stages progressively folded.']
          ]
        },
        'language-theme': {
          title: 'Language & Theme Selector',
          lead: 'Appearance and language bottom sheet allowing instant runtime switching between System/Light/Dark themes and zh/en/ja locales.',
          secTitle: 'Segmented Theme & Locale Controls',
          secDesc: 'Persists immediately via <code class="inline-code">PreferencesService</code> and updates <code class="inline-code">MaterialApp</code> without restarting.',
          preview: `
            <div style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px;">
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
                <button class="p-btn p-btn-regular" onclick="setTheme('system')">🖥 跟随系统</button>
                <button class="p-btn p-btn-regular p-btn-primary" onclick="setTheme('light')">☀ 浅色模式</button>
                <button class="p-btn p-btn-regular" onclick="setTheme('dark')">☾ 深色模式</button>
              </div>
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
                <button class="p-btn p-btn-regular p-btn-primary">中文 (zh)</button>
                <button class="p-btn p-btn-regular">English (en)</button>
                <button class="p-btn p-btn-regular">日本語 (ja)</button>
              </div>
            </div>
          `,
          code: `await controller.setThemeMode(ThemeMode.light);
await controller.setLanguageCode('zh');`,
          props: [
            ['themeMode', 'ThemeMode', 'ThemeMode.system | ThemeMode.light | ThemeMode.dark'],
            ['languageCode', 'String', "'zh' | 'en' | 'ja'"]
          ]
        },
        'dialog-sheet': {
          title: 'Dialog & Bottom Sheet',
          lead: 'Modal bottom sheets (28px top radius, sheetCurve 0.32, 0.72, 0, 1) for harmonica key selection, song icon customization, and data clearing confirmation.',
          secTitle: 'Bottom Sheet Container',
          secDesc: 'Uses <code class="inline-code">showModalBottomSheet</code> with safe-area padding and keyboard inset awareness.',
          preview: `
            <div style="width:100%;max-width:420px;padding:16px;border-radius:20px;background:var(--bg-panel);border:1px solid var(--border-strong);">
              <div style="font-weight:700;font-size:16px;margin-bottom:4px;">选择口琴调性 (Choose Key)</div>
              <div style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">查看口琴外壳印着的字母，课程与示范音将自动同步。</div>
              <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">
                <button class="p-btn p-btn-small p-btn-primary mono">C 调</button>
                <button class="p-btn p-btn-small mono">D 调</button>
                <button class="p-btn p-btn-small mono">F 调</button>
                <button class="p-btn p-btn-small mono">G 调</button>
              </div>
            </div>
          `,
          code: `showModalBottomSheet<void>(
  context: context,
  backgroundColor: context.colors.surface,
  shape: const RoundedRectangleBorder(
    borderRadius: BorderRadius.vertical(top: Radius.circular(28)),
  ),
  builder: (context) => ...,
);`,
          props: [
            ['borderRadius', 'BorderRadius', 'BorderRadius.vertical(top: Radius.circular(28))'],
            ['isScrollControlled', 'bool', 'True for sheets containing TextFields or multi-row grids.']
          ]
        },
        'empty-error': {
          title: 'Empty & Error States',
          lead: 'Graceful fallback cards for empty song search results, microphone permission prompts, and unsupported platform audio warnings.',
          secTitle: 'Permission & Empty Search Fallbacks',
          secDesc: 'Provides clear recovery actions (Retry / Open Settings / Help) without raw exception strings.',
          preview: `
            <div style="width:100%;max-width:440px;padding:16px;border-radius:16px;background:var(--red-muted);border:1px solid var(--red-border);display:flex;justify-content:space-between;align-items:center;gap:12px;">
              <div>
                <div style="font-weight:700;color:var(--red-emphasis);font-size:14px;">麦克风读取失败，请重试。</div>
                <div style="font-size:12px;color:var(--text-secondary);">声音只在设备上实时分析，不会上传。</div>
              </div>
              <button class="p-btn p-btn-small p-btn-destructive">重试</button>
            </div>
          `,
          code: `if (_errorMessage != null)
  _ErrorBanner(
    message: _errorMessage!,
    onRetry: _startListening,
  )`,
          props: [
            ['message', 'String', 'Localized user-facing explanation from AppStrings.'],
            ['actionLabel', 'String', 'Retry, Open settings, or Help depending on failure cause.']
          ]
        },
        'slider-switch': {
          title: 'Slider & Switch',
          lead: 'Tuner detection sensitivity slider (dBFS threshold mapping) and Profile preference switches (Haptics, High Contrast, Reduce Motion).',
          secTitle: 'Detection Sensitivity & Accessibility Toggles',
          secDesc: 'Maps 0.0–1.0 sensitivity slider to dBFS threshold and persists via SharedPreferences.',
          preview: `
            <div style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;">
              <div style="padding:12px 14px;border:1px solid var(--border-main);border-radius:12px;background:var(--bg-panel);">
                <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px;">
                  <span>检测灵敏度 (Detection Sensitivity)</span>
                  <span class="mono" style="color:var(--blue-base)">68% (-38 dBFS)</span>
                </div>
                <input type="range" min="10" max="100" value="68" style="width:100%;accent-color:var(--blue-base);" />
              </div>
            </div>
          `,
          code: `Slider(
  value: controller.microphoneSensitivity,
  onChanged: controller.setMicrophoneSensitivity,
)`,
          props: [
            ['microphoneSensitivity', 'double', 'Default 0.68; maps to dBFS input gate in PitchService.'],
            ['reduceMotion', 'bool', 'Disables continuous pulse rings and zeroes transition durations.']
          ]
        }
      };

      const cfg = configs[id] || {
        title: PAGES.find(p => p.id === id)?.title || id,
        lead: `Palermo × 初鸣 standardized component specification for ${id}.`,
        secTitle: 'Interactive Preview',
        secDesc: 'Synced with Flutter widget implementation in <code class="inline-code">lib/src/widgets/</code>.',
        preview: `
          <span class="p-pill p-pill-blue">Palermo Component · ${id}</span>
          <button class="p-btn p-btn-regular p-btn-primary">Interactive Action</button>
        `,
        code: `// lib/src/widgets/shared_widgets.dart\nconst ${id.replace(/-/g, '_')} = true;`,
        props: [
          ['key', 'Key?', 'Widget key for test and animation identification.'],
          ['reduceMotion', 'bool', 'Automatically honors MediaQuery & AppController.reduceMotion.']
        ]
      };

      return `
        <h1 class="doc-title">${cfg.title}</h1>
        <p class="doc-lead">${cfg.lead}</p>
        <div class="doc-section">
          <h2 class="doc-h2">${cfg.secTitle}</h2>
          <p class="doc-desc">${cfg.secDesc}</p>
          ${previewBlock(id, cfg.preview, cfg.code)}
        </div>
        <div class="doc-section">
          <h2 class="doc-h2">Properties</h2>
          <table class="props-table">
            <thead>
              <tr><th>Prop</th><th>Type</th><th>Description</th></tr>
            </thead>
            <tbody>
              ${cfg.props.map(r => `
                <tr>
                  <td class="mono" style="font-weight:600;color:var(--text-primary)">${r[0]}</td>
                  <td class="mono" style="color:var(--blue-base)">${r[1]}</td>
                  <td style="color:var(--text-secondary)">${r[2]}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // Interactive Component Handlers
    let hdHole = 4;
    let hdDir = 'blow';
    const hdColors = ['#FF5F57','#FE6E00','#F59E0B','#15B462','#06B6D4','#376CFF','#6366F1','#8B5CF6','#EC4899','#14B8A6'];
    const nsNotes = ['4↑','4↑','6↑','6↑','6↓','6↓','6↑'];
    let nsIdx = 0;

    window._setHdDir = function(d) { hdDir = d; initInteractiveHandlers('harmonica-diagram'); };
    window._stepNs = function() { nsIdx = (nsIdx + 1) % nsNotes.length; initInteractiveHandlers('note-sequence'); };
    window._setLocDemo = function(lang) {
      const data = {
        zh: {
          stage: '当前进行中 · 第 02 课',
          dur: '约 6 分钟',
          title: '吹响第一个音',
          detail: '含住第 4 孔，轻轻吹气。声音只在设备上分析，不会上传或保存。',
          act: '🎤 开始练习',
          guide: '🔊 播放 F 的示范音'
        },
        en: {
          stage: 'In Progress · Lesson 02',
          dur: 'About 6 min',
          title: 'Play your first note',
          detail: 'Blow gently into hole 4. Audio is analyzed only on this device and never uploaded.',
          act: '🎤 Start practice',
          guide: '🔊 Play the F guide note'
        },
        ja: {
          stage: '現在のステージ · 第 02 レッスン',
          dur: '約 6 分',
          title: '最初の音を出す',
          detail: '4 番穴をくわえて、やさしく吹きます。音声は端末内だけで解析されます。',
          act: '🎤 練習を開始',
          guide: '🔊 F のお手本を再生'
        }
      }[lang];
      if (!data) return;
      document.getElementById('locStageBadge').textContent = data.stage;
      document.getElementById('locDuration').textContent = data.dur;
      document.getElementById('locTitle').textContent = data.title;
      document.getElementById('locDetail').textContent = data.detail;
      document.getElementById('locAction').textContent = data.act;
      document.getElementById('locGuide').textContent = data.guide;
      ['Zh','En','Ja'].forEach(k => {
        const btn = document.getElementById('locBtn' + k);
        if (btn) btn.classList.toggle('p-btn-primary', k.toLowerCase() === lang);
      });
    };
    window._runMotionDemo = function(dur, curve) {
      const ball = document.getElementById('motionBall');
      if (!ball) return;
      ball.style.transition = `transform ${dur} ${curve}`;
      const moved = ball.dataset.moved === '1';
      ball.style.transform = moved ? 'translateX(0px)' : 'translateX(280px)';
      ball.dataset.moved = moved ? '0' : '1';
    };
    window._validateTabInput = function(val) {
      const msg = document.getElementById('tabInputMsg');
      const input = document.getElementById('tabInputDemo');
      if (!msg || !input) return;
      const tokens = val.replace(/[|，,]/g, ' ').trim().split(/\s+/).filter(Boolean);
      if (tokens.length === 0) {
        msg.style.color = 'var(--red-base)';
        input.style.borderColor = 'var(--red-base)';
        msg.textContent = '⚠ 请输入至少一个音，例如：4↑ 4↑ 6↑';
        return;
      }
      const invalid = tokens.find(t => !/^([1-9]|10)[↑↓]$/.test(t));
      if (invalid) {
        msg.style.color = 'var(--red-base)';
        input.style.borderColor = 'var(--red-base)';
        msg.textContent = `⚠ 无法识别「${invalid}」，请使用 4↑ 或 4↓ 这样的格式。`;
      } else {
        msg.style.color = 'var(--green-base)';
        input.style.borderColor = 'var(--blue-base)';
        msg.textContent = `✓ 已解析 ${tokens.length} 个有效音符：${tokens.join(', ')}`;
      }
    };
    window._updatePg = function(v) {
      const c = parseInt(v, 10);
      const pill = document.getElementById('pgPill');
      if (!pill) return;
      if (Math.abs(c) <= 10) {
        pill.className = 'p-pill p-pill-green mono';
        pill.textContent = `准确 · ${c} 音分 (命中目标音)`;
      } else if (c < 0) {
        pill.className = 'p-pill p-pill-blue mono';
        pill.textContent = `偏低 · ${c} 音分`;
      } else {
        pill.className = 'p-pill p-pill-orange mono';
        pill.textContent = `偏高 · +${c} 音分`;
      }
    };

    function initInteractiveHandlers(id) {
      if (id === 'harmonica-diagram') {
        const grid = document.getElementById('hdGrid');
        if (!grid) return;
        grid.innerHTML = Array.from({length: 10}, (_, i) => {
          const h = i + 1;
          const active = h === hdHole;
          const col = hdDir === 'blow' ? 'var(--blue-base)' : 'var(--orange-base)';
          return `
            <div onclick="hdHole=${h};initInteractiveHandlers('harmonica-diagram')" style="cursor:pointer;text-align:center;border-right:${h<10?'1px solid var(--border-main)':'none'};background:${active?'var(--bg-subtle)':'transparent'};outline:${active?'2px solid '+col:'none'};outline-offset:-2px;">
              <div style="height:4px;background:${hdColors[i]}"></div>
              <div class="mono" style="padding:10px 0;font-weight:${active?800:500};color:${active?col:'var(--text-secondary)'}">${h}</div>
              <div style="border-top:1px solid var(--border-main);padding:10px 0;font-weight:800;color:${active?col:'var(--text-muted)'}">${active?(hdDir==='blow'?'↑':'↓'):'·'}</div>
            </div>
          `;
        }).join('');
        const badge = document.getElementById('hdBadge');
        if (badge) {
          badge.className = 'p-pill mono ' + (hdDir === 'blow' ? 'p-pill-blue' : 'p-pill-orange');
          badge.textContent = `${hdHole}${hdDir === 'blow' ? '↑' : '↓'} · Hole ${hdHole} (${hdDir === 'blow' ? 'Blow' : 'Draw'})`;
        }
      } else if (id === 'note-sequence') {
        const row = document.getElementById('nsRow');
        if (!row) return;
        row.innerHTML = nsNotes.map((t, idx) => {
          const done = idx < nsIdx;
          const active = idx === nsIdx;
          return `
            <button class="p-btn mono" onclick="nsIdx=${idx};initInteractiveHandlers('note-sequence')" style="height:40px;font-weight:800;border:${active?'2px solid var(--blue-base)':'1px solid var(--border-main)'};background:${active?'var(--blue-muted)':(done?'var(--green-muted)':'var(--bg-subtle)')};color:${active?'var(--blue-base)':(done?'var(--green-emphasis)':'var(--text-primary)')}">${t}</button>
          `;
        }).join('');
        const pct = Math.round((nsIdx / nsNotes.length) * 100);
        document.getElementById('nsStep').textContent = `第 ${nsIdx + 1} 个音，共 ${nsNotes.length} 个`;
        document.getElementById('nsPct').textContent = `已完成 ${pct}%`;
        document.getElementById('nsBar').style.width = `${Math.max(5, pct)}%`;
      }
    }

    // Boot from hash or default to get-started
    const initialHash = window.location.hash.replace('#/docs/', '');
    navigate(initialHash || 'get-started');
  </script>
</body>
</html>
