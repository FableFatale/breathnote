<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background Royal Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F85FF"/>
      <stop offset="45%" stop-color="#2D63ED"/>
      <stop offset="100%" stop-color="#143EB8"/>
    </linearGradient>

    <!-- Radial Glow Behind Instrument -->
    <radialGradient id="centerGlow" cx="50%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#6FA3FF" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#3369FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2554D9" stop-opacity="0"/>
    </radialGradient>

    <!-- Harmonica Cover Plates Gradient -->
    <linearGradient id="plateTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F2F5FD"/>
      <stop offset="100%" stop-color="#D9E2F5"/>
    </linearGradient>
    <linearGradient id="plateBottomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9E2F5"/>
      <stop offset="30%" stop-color="#F4F7FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Metallic Rim Specular Highlight -->
    <linearGradient id="rimHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#E2EBFF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="80%" stop-color="#E2EBFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Comb Body Gradient -->
    <linearGradient id="combGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFF"/>
      <stop offset="100%" stop-color="#E5EDFC"/>
    </linearGradient>

    <!-- Standard Slot Acoustic Chamber Depth -->
    <linearGradient id="slotDeepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E235C"/>
      <stop offset="40%" stop-color="#143178"/>
      <stop offset="100%" stop-color="#1D429F"/>
    </linearGradient>

    <!-- Emerald Highlight for 4th Hole (First Note / 初鸣) -->
    <linearGradient id="emeraldLustre" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#46F594"/>
      <stop offset="40%" stop-color="#1AD473"/>
      <stop offset="100%" stop-color="#0E9E52"/>
    </linearGradient>

    <!-- Emerald Aura / Glow Filter -->
    <filter id="emeraldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop Shadow for Harmonica Elevation -->
    <filter id="harmonicaShadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#091B4C" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#091B4C" flood-opacity="0.25"/>
    </filter>

    <!-- Acoustic Sound Wave Clip -->
    <clipPath id="safeClip">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
  </defs>

  <!-- Background Squircle (Apple iOS 22.8% continuous curvature) -->
  <rect width="1024" height="1024" rx="228" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Radial Glow -->
  <rect width="1024" height="1024" rx="228" fill="url(#centerGlow)"/>

  <!-- Concentric Acoustic Resonant Ripples (音浪共鸣环) -->
  <g clip-path="url(#safeClip)" opacity="0.4">
    <ellipse cx="512" cy="516" rx="420" ry="240" fill="none" stroke="#FFFFFF" stroke-width="2.2" opacity="0.10" stroke-dasharray="14 10"/>
    <ellipse cx="512" cy="516" rx="340" ry="190" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.18"/>
    <ellipse cx="512" cy="516" rx="260" ry="145" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.28"/>
    <ellipse cx="512" cy="516" rx="180" ry="100" fill="none" stroke="#46F594" stroke-width="3.5" opacity="0.35"/>
  </g>

  <!-- Harmonic Sine Soundwave Ribbon (气息转化音流) -->
  <path d="M 120 440 C 260 360, 360 480, 512 430 C 664 380, 760 490, 904 430" 
        fill="none" stroke="url(#rimHighlight)" stroke-width="3.5" opacity="0.25" clip-path="url(#safeClip)"/>
  <path d="M 160 590 C 300 520, 400 640, 512 590 C 624 540, 720 650, 864 580" 
        fill="none" stroke="#46F594" stroke-width="3" opacity="0.20" clip-path="url(#safeClip)"/>

  <!-- Instrument Assembly with Floating Elevation -->
  <g filter="url(#harmonicaShadow)">
    
    <!-- Outer Metal Bezel / Chassis Backing -->
    <rect x="180" y="380" width="664" height="264" rx="48" fill="#C5D3EE"/>
    
    <!-- Top Aerodynamic Cover Plate -->
    <path d="M 236 348 
             L 788 348 
             A 36 36 0 0 1 824 384 
             L 824 416 
             L 200 416 
             L 200 384 
             A 36 36 0 0 1 236 348 Z" 
          fill="url(#plateTopGrad)"/>
    <path d="M 236 348 L 788 348 A 36 36 0 0 1 824 384 L 824 388 L 200 388 L 200 384 A 36 36 0 0 1 236 348 Z" 
          fill="#FFFFFF" opacity="0.8"/>

    <!-- Bottom Aerodynamic Cover Plate -->
    <path d="M 200 608 
             L 824 608 
             L 824 640 
             A 36 36 0 0 1 788 676 
             L 236 676 
             A 36 36 0 0 1 200 640 
             Z" 
          fill="url(#plateBottomGrad)"/>
    <path d="M 200 608 L 824 608 L 824 612 L 200 612 Z" fill="#B3C4E8" opacity="0.6"/>

    <!-- Central Acoustic Comb Body (Precision Polished Ceramic White) -->
    <rect x="184" y="416" width="656" height="192" rx="32" fill="url(#combGrad)"/>
    
    <!-- Inner Rim Stroke Highlight -->
    <rect x="186" y="418" width="652" height="190" rx="30" fill="none" stroke="url(#rimHighlight)" stroke-width="2.5" opacity="0.9"/>

    <!-- Rivet Screws (Left & Right Acoustic Mounting Posts) -->
    <!-- Left Rivet -->
    <circle cx="224" cy="402" r="12" fill="#E2E9F8"/>
    <circle cx="224" cy="402" r="12" fill="none" stroke="#9EAFCE" stroke-width="1.8"/>
    <line x1="216" y1="402" x2="232" y2="402" stroke="#7A8CAE" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Right Rivet -->
    <circle cx="800" cy="402" r="12" fill="#E2E9F8"/>
    <circle cx="800" cy="402" r="12" fill="none" stroke="#9EAFCE" stroke-width="1.8"/>
    <line x1="792" y1="402" x2="808" y2="402" stroke="#7A8CAE" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 7 Iconic Acoustic Reed Apertures (Balanced golden proportion for app icons) -->
    <!-- Hole 1 -->
    <rect x="252" y="452" width="56" height="120" rx="18" fill="url(#slotDeepGrad)"/>
    <rect x="254" y="454" width="52" height="116" rx="16" fill="none" stroke="#3D63BA" stroke-width="1.8" opacity="0.6"/>

    <!-- Hole 2 -->
    <rect x="332" y="452" width="56" height="120" rx="18" fill="url(#slotDeepGrad)"/>
    <rect x="334" y="454" width="52" height="116" rx="16" fill="none" stroke="#3D63BA" stroke-width="1.8" opacity="0.6"/>

    <!-- Hole 3 -->
    <rect x="412" y="452" width="56" height="120" rx="18" fill="url(#slotDeepGrad)"/>
    <rect x="414" y="454" width="52" height="116" rx="16" fill="none" stroke="#3D63BA" stroke-width="1.8" opacity="0.6"/>

    <!-- Hole 4: The Hero "初鸣 / First Note" (Illuminated Palermo Emerald with Inner Depth) -->
    <!-- Outer Glow Underlay -->
    <rect x="486" y="438" width="68" height="148" rx="22" fill="#38EF7D" opacity="0.45" filter="url(#emeraldGlow)"/>
    
    <!-- Master 4th Slot Body -->
    <rect x="490" y="442" width="60" height="140" rx="20" fill="url(#emeraldLustre)"/>
    
    <!-- Inner Radiant Core & Specular Rim -->
    <rect x="493" y="445" width="54" height="134" rx="17" fill="none" stroke="#A7FFCE" stroke-width="2.8" opacity="0.95"/>
    <ellipse cx="520" cy="482" rx="16" ry="24" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="520" cy="512" r="6" fill="#FFFFFF" opacity="0.85"/>

    <!-- Hole 5 -->
    <rect x="572" y="452" width="56" height="120" rx="18" fill="url(#slotDeepGrad)"/>
    <rect x="574" y="454" width="52" height="116" rx="16" fill="none" stroke="#3D63BA" stroke-width="1.8" opacity="0.6"/>

    <!-- Hole 6 -->
    <rect x="652" y="452" width="56" height="120" rx="18" fill="url(#slotDeepGrad)"/>
    <rect x="654" y="454" width="52" height="116" rx="16" fill="none" stroke="#3D63BA" stroke-width="1.8" opacity="0.6"/>

    <!-- Hole 7 -->
    <rect x="732" y="452" width="56" height="120" rx="18" fill="url(#slotDeepGrad)"/>
    <rect x="734" y="454" width="52" height="116" rx="16" fill="none" stroke="#3D63BA" stroke-width="1.8" opacity="0.6"/>

  </g>
</svg>