<!DOCTYPE html>
<html lang="zh">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F1E9">
  <meta name="description" content="初鸣｜见音口琴陪练">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="初鸣">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>初鸣</title>
  <style>
    :root {
      color-scheme: light;
      --background: #F6F1E9;
      --surface: #FFFCF7;
      --ink: #2A2620;
      --primary: #2F4A8A;
      --outline: #E2D8C9;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--background);
      color: var(--ink);
    }

    body {
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #app-loading {
      width: min(240px, calc(100vw - 48px));
      text-align: center;
    }

    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border: 2px solid var(--primary);
      border-radius: 18px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      gap: 5px;
      padding: 15px 12px;
      background: var(--surface);
    }

    .mark span {
      display: block;
      height: 22px;
      border-radius: 6px;
      background: var(--primary);
      opacity: 0.14;
    }

    .mark span:nth-child(2) { opacity: 0.25; }
    .mark span:nth-child(3) { opacity: 0.45; }
    .mark span:nth-child(4) { opacity: 0.72; }
    .mark span:nth-child(5) { opacity: 1; }

    #app-loading p {
      margin: 0 0 16px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
    }

    .track {
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--outline);
    }

    .bar {
      width: 38%;
      height: 100%;
      border-radius: 999px;
      background: var(--primary);
      animation: prepare 1.6s ease-in-out infinite;
    }

    @keyframes prepare {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(263%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar {
        width: 100%;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <p id="app-loading-text">正在准备课程</p>
    <div class="track" aria-hidden="true"><div class="bar"></div></div>
  </div>
  <script>
    {{flutter_js}}
  </script>
  <script>
    {{flutter_build_config}}
  </script>
  <script>
    const loadingLanguage = navigator.language.toLowerCase();
    const loadingText = document.getElementById("app-loading-text");
    if (loadingText) {
      if (loadingLanguage.startsWith("ja")) {
        loadingText.textContent = "レッスンを準備中";
      } else if (loadingLanguage.startsWith("en")) {
        loadingText.textContent = "Preparing your lesson";
      }
    }
    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
        document.getElementById("app-loading")?.remove();
      }
    });
  </script>
</body>
</html>
