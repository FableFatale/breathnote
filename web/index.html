<!DOCTYPE html>
<html lang="zh">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18181A" media="(prefers-color-scheme: dark)">
  <meta name="description" content="初鸣｜见音十孔口琴实时陪练">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="初鸣">
  <link rel="preload" as="image" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>初鸣</title>
  <style>
    :root {
      color-scheme: light dark;

      /* Palermo 2.0 Light & Dark raw tokens */
      --bg-light: #FFFFFF;
      --bg-dark: #18181A;
      --surface-light: #FAFAFA;
      --surface-dark: #222224;
      --ink-light: #18181A;
      --ink-dark: #F4F4F5;
      --muted-light: #787878;
      --muted-dark: #A1A1AA;
      --primary-light: #376CFF;
      --primary-dark: #5E9EFF;
      --primary-ink-light: #FFFFFF;
      --primary-ink-dark: #18181A;
      --outline-light: #EBEBEB;
      --outline-dark: #3F3F46;

      --bg: var(--bg-light);
      --surface: var(--surface-light);
      --ink: var(--ink-light);
      --muted: var(--muted-light);
      --primary: var(--primary-light);
      --primary-ink: var(--primary-ink-light);
      --outline: var(--outline-light);

      @media (prefers-color-scheme: dark) {
        --bg: var(--bg-dark);
        --surface: var(--surface-dark);
        --ink: var(--ink-dark);
        --muted: var(--muted-dark);
        --primary: var(--primary-dark);
        --primary-ink: var(--primary-ink-dark);
        --outline: var(--outline-dark);
      }

      @supports (color: light-dark(white, black)) {
        --bg: light-dark(var(--bg-light), var(--bg-dark));
        --surface: light-dark(var(--surface-light), var(--surface-dark));
        --ink: light-dark(var(--ink-light), var(--ink-dark));
        --muted: light-dark(var(--muted-light), var(--muted-dark));
        --primary: light-dark(var(--primary-light), var(--primary-dark));
        --primary-ink: light-dark(var(--primary-ink-light), var(--primary-ink-dark));
        --outline: light-dark(var(--outline-light), var(--outline-dark));
      }

      accent-color: var(--primary);
      scrollbar-color: var(--muted) var(--surface);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        env(safe-area-inset-top, 16px)
        max(20px, env(safe-area-inset-right, 20px))
        env(safe-area-inset-bottom, 16px)
        max(20px, env(safe-area-inset-left, 20px));
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    }

    #app-loading {
      width: min(280px, 100%);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: opacity 180ms ease-out;
    }

    #app-loading.is-leaving {
      opacity: 0;
    }

    .brand-icon {
      display: block;
      width: 76px;
      height: 76px;
      aspect-ratio: 1;
      border-radius: 20px;
      border: 1px solid var(--outline);
      background: var(--surface);
      object-fit: cover;
      margin-bottom: 4px;
    }

    #app-loading-title {
      margin: 0;
      font-size: clamp(1.125rem, 1rem + 0.5vw, 1.375rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--ink);
    }

    #app-loading-text {
      margin: 0;
      font-size: clamp(0.875rem, 0.84rem + 0.2vw, 1rem);
      font-weight: 500;
      line-height: 1.5;
      color: var(--muted);
    }

    /* Semantic indeterminate <progress> spinner per Modern Web Guidance */
    @property --arc-start {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    @property --arc-end {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    @property --progress-dash-animation {
      syntax: "*";
      inherits: false;
      initial-value: , progress-dash 3s ease-in-out infinite;
    }

    progress.loading-spinner:indeterminate::-webkit-progress-bar {
      display: none;
      background: none;
    }
    progress.loading-spinner:indeterminate::-webkit-progress-value {
      display: none;
      background: none;
    }
    progress.loading-spinner:indeterminate::-moz-progress-bar {
      display: none;
      background: none;
    }
    progress.loading-spinner:indeterminate::slider-fill {
      display: none;
      background: none;
    }

    progress.loading-spinner:indeterminate {
      --_from: calc(90deg + var(--arc-start, 0deg));
      --_to: calc(90deg + var(--arc-end, 158deg));
      --size: 32px;
      --thickness: 3px;
      --spinner-color: var(--primary);
      --track-color: var(--outline);
      --spinner-duration: 1.5s;
      --_used-spinner-duration: var(--spinner-duration);

      position: relative;
      display: block;
      width: var(--size);
      height: var(--size);
      margin-top: 4px;
      border-radius: 50%;
      appearance: none;
      background: conic-gradient(
          from var(--_from),
          var(--spinner-color) calc(var(--_to) - var(--_from)),
          transparent 0
        )
        var(--track-color);

      @supports (background-clip: border-area) {
        background-clip: border-area;
        border: var(--thickness) solid transparent;
        background-origin: border-box;
      }

      @supports not (background-clip: border-area) {
        --clip-boundary: calc(100% - var(--thickness));
        mask-image: radial-gradient(
          farthest-side,
          transparent var(--clip-boundary),
          black var(--clip-boundary)
        );
        border: 0;
      }

      @media (forced-colors: active) {
        forced-color-adjust: none;
        --spinner-color: CanvasText;
        --track-color: Canvas;
      }

      animation:
        progress-spin var(--_used-spinner-duration) linear infinite
        var(--progress-dash-animation, );
    }

    @keyframes progress-spin {
      to {
        rotate: 1turn;
      }
    }

    @keyframes progress-dash {
      from {
        --arc-start: 0deg;
        --arc-end: 3deg;
      }
      50% {
        --arc-start: 100deg;
        --arc-end: 358deg;
      }
      to {
        --arc-start: 360deg;
        --arc-end: 363deg;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loading {
        transition: none;
      }
      progress.loading-spinner:indeterminate {
        --_used-spinner-duration: 6s;
        --progress-dash-animation: ;
        --arc-end: 158deg;
      }
    }

    #app-loading-retry {
      display: none;
      margin-top: 4px;
      min-height: 44px;
      padding: 10px 20px;
      border: 1px solid var(--outline);
      border-radius: 9999px;
      background: var(--primary);
      color: var(--primary-ink);
      font: inherit;
      font-size: 0.9375rem;
      font-weight: 700;
      cursor: pointer;
    }

    #app-loading[data-error="true"] progress.loading-spinner {
      display: none;
    }

    #app-loading[data-error="true"] #app-loading-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .noscript-card {
      max-width: 320px;
      padding: 20px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--outline);
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <img class="brand-icon" src="icons/Icon-192.png" alt="初鸣" width="76" height="76">
    <h1 id="app-loading-title">初鸣</h1>
    <p id="app-loading-text">正在准备课程…</p>
    <progress id="app-loading-spinner" class="loading-spinner" aria-label="正在准备课程"></progress>
    <button id="app-loading-retry" type="button">重新加载</button>
  </div>
  <noscript>
    <div class="noscript-card">
      <strong>初鸣 · Breathnote</strong><br>
      请启用浏览器 JavaScript 后刷新页面，以加载十孔口琴陪练应用。
    </div>
  </noscript>
  <script>
    {{flutter_js}}
  </script>
  <script>
    {{flutter_build_config}}
  </script>
  <script>
    const rawLang = (navigator.language || "zh").toLowerCase();
    const copy = rawLang.startsWith("ja")
      ? {
          htmlLang: "ja",
          title: "初鳴 | Breathnote",
          heading: "初鳴",
          loading: "レッスンを準備中…",
          failed: "読み込みに失敗しました",
          retry: "再読み込み"
        }
      : rawLang.startsWith("en")
      ? {
          htmlLang: "en",
          title: "Breathnote",
          heading: "Breathnote",
          loading: "Preparing your lesson…",
          failed: "Unable to load Breathnote",
          retry: "Reload"
        }
      : {
          htmlLang: "zh",
          title: "初鸣",
          heading: "初鸣",
          loading: "正在准备课程…",
          failed: "加载失败，请重试",
          retry: "重新加载"
        };

    document.documentElement.lang = copy.htmlLang;
    document.title = copy.title;

    const loadingBox = document.getElementById("app-loading");
    const loadingTitle = document.getElementById("app-loading-title");
    const loadingText = document.getElementById("app-loading-text");
    const loadingSpinner = document.getElementById("app-loading-spinner");
    const retryButton = document.getElementById("app-loading-retry");

    if (loadingTitle) loadingTitle.textContent = copy.heading;
    if (loadingText) loadingText.textContent = copy.loading;
    if (loadingSpinner) loadingSpinner.setAttribute("aria-label", copy.loading);
    if (retryButton) {
      retryButton.textContent = copy.retry;
      retryButton.addEventListener("click", () => window.location.reload());
    }

    function showBootError() {
      if (!loadingBox) return;
      loadingBox.dataset.error = "true";
      if (loadingText) loadingText.textContent = copy.failed;
    }

    try {
      Promise.resolve(
        _flutter.loader.load({
          onEntrypointLoaded: async function (engineInitializer) {
            try {
              const appRunner = await engineInitializer.initializeEngine();
              await appRunner.runApp();
              if (!loadingBox) return;
              const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
              if (reduced) {
                loadingBox.remove();
              } else {
                loadingBox.classList.add("is-leaving");
                window.setTimeout(() => loadingBox.remove(), 200);
              }
            } catch (_) {
              showBootError();
            }
          }
        })
      ).catch(showBootError);
    } catch (_) {
      showBootError();
    }
  </script>
</body>
</html>
