name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure shared CAS cache path
        run: |
          CAS_DIR="$(cd "$RUNNER_TEMP" && pwd -P)/xcode-shared-cas"
          mkdir -p "$CAS_DIR"
          echo "BREATHNOTE_CAS_CACHE_DIR=$CAS_DIR" >> "$GITHUB_ENV"

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -n 1 || true)
          if [[ -z "$LATEST_XCODE" ]]; then
            LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          fi
          echo "Using Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version
          clang --version
          swiftc --version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Restore global shared Xcode CAS cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xcode-shared-cas
          key: xcode-cas-ios-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'ios/Flutter/CompilationCache.xcconfig') }}-${{ github.sha }}
          restore-keys: |
            xcode-cas-ios-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'ios/Flutter/CompilationCache.xcconfig') }}-
            xcode-cas-ios-${{ runner.os }}-

      - name: Analyze & run Flutter tests
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build iOS Release IPA & Simulator App (Worktree A)
        run: |
          set -euo pipefail
          chmod +x scripts/configure_ios_cache.sh scripts/build_ios.sh scripts/verify_worktree_cas_hit.sh
          ./scripts/build_ios.sh --cas-remarks 2>&1 | tee /tmp/wt_a_build.log

      - name: Verify cross-worktree CAS cache hit rate (Worktree B with isolated DerivedData)
        run: |
          set -euo pipefail
          WT_B="$(cd "$RUNNER_TEMP" && pwd -P)/breathnote-wt-verify"
          git worktree add --detach "$WT_B" HEAD
          export BREATHNOTE_DERIVED_DATA_DIR="$WT_B/build/ios-derived-data"
          echo "==> Building from second git worktree ($WT_B) with fresh DerivedData ($BREATHNOTE_DERIVED_DATA_DIR)..."
          (
            cd "$WT_B"
            ./scripts/build_ios.sh --ipa-only --cas-remarks 2>&1 | tee /tmp/wt_b_build.log
          )
          python3 - <<'PY'
          import os, pathlib, re

          log = pathlib.Path("/tmp/wt_b_build.log").read_text(encoding="utf-8", errors="replace")
          metrics = re.findall(r"note:\s*(\d+)\s*hits\s*/\s*(\d+)\s*cacheable tasks\s*\((\d+(?:\.\d+)?)%\)", log)
          hits = len(re.findall(r"cache hit|replay output (?:from|file)", log, flags=re.IGNORECASE))
          misses = len(re.findall(r"cache miss", log, flags=re.IGNORECASE))
          total = hits + misses
          pct = (hits * 100.0 / total) if total > 0 else 0.0

          summary_lines = [
              "### iOS Build & Cross-Worktree CAS Cache Summary",
              f"- **Commit**: `{os.environ.get('GITHUB_SHA', '')}`",
              f"- **Worktree A DerivedData**: `{os.environ.get('GITHUB_WORKSPACE', '')}/build/ios-derived-data`",
              f"- **Worktree B DerivedData**: `{os.environ.get('BREATHNOTE_DERIVED_DATA_DIR', '')}`",
              f"- **Global Shared CAS**: `{os.environ.get('BREATHNOTE_CAS_CACHE_DIR', '')}`",
          ]
          if metrics:
              m_hits, m_total, m_pct = metrics[-1]
              summary_lines.append(
                  f"- **Xcode CompilationCacheMetrics (Worktree B)**: **{m_hits} / {m_total} cacheable tasks ({m_pct}%)**"
              )
          if total > 0:
              summary_lines.append(
                  f"- **Diagnostic Remarks Hits**: **{hits} / {total} ({pct:.1f}%)** (misses: {misses})"
              )
          report = "\n".join(summary_lines) + "\n"
          print(report)
          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "a", encoding="utf-8") as f:
                  f.write(report)
          PY
          git worktree remove --force "$WT_B"

      - name: Package clean iOS Xcode scaffold for repository sync
        run: |
          set -euo pipefail
          mkdir -p /tmp/ios-scaffold-export
          rsync -a \
            --exclude 'Pods/' \
            --exclude '.symlinks/' \
            --exclude 'Flutter/ephemeral/' \
            --exclude 'Flutter/Generated.xcconfig' \
            --exclude 'Flutter/flutter_export_environment.sh' \
            --exclude 'Flutter/WorktreePrefixMap.xcconfig' \
            --exclude 'Flutter/.last_build_id' \
            --exclude 'Runner.xcworkspace/xcuserdata/' \
            --exclude 'Runner.xcodeproj/xcuserdata/' \
            --exclude 'Runner.xcodeproj/project.xcworkspace/xcuserdata/' \
            ios/ /tmp/ios-scaffold-export/ios/
          shasum -a 256 artifacts/breathnote-current-ios-unsigned.ipa artifacts/breathnote-current-ios-simulator.app.zip >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: breathnote-ios-unsigned-ipa
          path: artifacts/breathnote-current-ios-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: breathnote-ios-simulator-app
          path: artifacts/breathnote-current-ios-simulator.app.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: breathnote-ios-project-scaffold
          path: /tmp/ios-scaffold-export/ios
          if-no-files-found: error

      - name: Publish iOS & Android packages to GitHub Release on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RAW_VER=$(grep -E '^version:\s*' pubspec.yaml | head -n 1 | awk '{print $2}' | tr -d '\r')
          REL_VER="${RAW_VER/+/.}"
          TAG="v${REL_VER}"
          rm -rf /tmp/release-assets /tmp/android-apk-dl
          mkdir -p /tmp/release-assets /tmp/android-apk-dl
          cp artifacts/breathnote-current-ios-unsigned.ipa "/tmp/release-assets/breathnote-${TAG}-ios-unsigned.ipa"
          cp artifacts/breathnote-current-ios-simulator.app.zip "/tmp/release-assets/breathnote-${TAG}-ios-simulator.app.zip"

          for _ in $(seq 1 18); do
            ANDROID_RUN_ID=$(gh run list --workflow=Android --commit "${GITHUB_SHA}" --json databaseId,status,conclusion --jq 'map(select(.status=="completed" and .conclusion=="success")) | .[0].databaseId // empty' || true)
            if [[ -n "${ANDROID_RUN_ID:-}" ]]; then
              if gh run download "$ANDROID_RUN_ID" -n breathnote-debug-apk -D /tmp/android-apk-dl; then
                cp /tmp/android-apk-dl/app-debug.apk "/tmp/release-assets/breathnote-${TAG}-debug.apk"
              fi
              break
            fi
            sleep 10
          done

          shasum -a 256 /tmp/release-assets/* >> "$GITHUB_STEP_SUMMARY"
          NOTES="BreathNote ${TAG} dual-platform build (Android Debug APK + iOS Unsigned Release IPA + iOS Simulator App) built from commit ${GITHUB_SHA}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/release-assets/* --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" /tmp/release-assets/* --title "BreathNote ${TAG} (Android APK & iOS IPA)" --notes "$NOTES" --latest
          fi
